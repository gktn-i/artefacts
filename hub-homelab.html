<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Homelab · Artefakte</title>
<meta name="description" content="Hub für Server, Storage, Netzwerk und Betrieb.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/hub.css">
<link rel="stylesheet" href="assets/chrome.css">
<script defer src="assets/registry.js"></script>
<script defer src="assets/shell.js"></script>
<script defer src="assets/hubpage.js"></script>
</head>

<!-- Der Hub wird ausschließlich über data-hub bestimmt; Inhalt kommt aus registry.js -->
<body data-hub="homelab">

<header class="hero">
  <div class="wrap">
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <button class="bigsearch" type="button" id="go">
      <span aria-hidden="true">🔍</span>
      <span class="t">In diesem Hub und allen anderen suchen …</span>
      <span class="k">⌘K</span>
    </button>
    <div class="stats" id="stats"></div>
    <nav class="jump" id="jump" aria-label="Bereiche"></nav>
  </div>
</header>

<main>
  <div class="wrap" id="areas"></div>

  <section class="blk">
    <div class="wrap">
      <div class="eyebrow">Andere Hubs</div>
      <div class="hubgrid" id="others"></div>
    </div>
  </section>
</main>

<footer class="site">
  <div class="wrap">
    <span><a href="index.html">← Alle Hubs</a></span>
    <span>Module und Abschnitte gepflegt in <a href="assets/registry.js">assets/registry.js</a></span>
  </div>
</footer>

</body>
</html>
